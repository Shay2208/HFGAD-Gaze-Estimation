---
train:

    params:
        batch_size: 16
        epoch: 80
        lr: 0.0005
        decay: 0.5
        decay_step: 60
        warmup: 5

    save:
        # 输出目录，相对于项目根 / output dir, relative to the project root
        metapath: "./evaluation"
        folder: diap
        model_name: gaze
        step: 10

    data:
        # 修改为本地数据集路径 / change to your local dataset path
        image: "./datasets/EyeDiap/Image"
        label: "./datasets/EyeDiap/ClusterLabel"
        header: True
        name: diap
        isFolder: True
        
    pretrain:
        enable: False
        path: PLACEHOLDER
        device: PLACEHOLDER

    device: 0

    reader: reader

# dropout = 0
# dim_feed = 512
