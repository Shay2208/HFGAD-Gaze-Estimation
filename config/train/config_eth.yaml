---
train:

    params:
        batch_size: 512
        epoch: 50
        lr: 0.0005
        decay: 0.5
        decay_step: 10
        warmup: 3

    save:
        # 输出目录，相对于项目根 / output dir, relative to the project root
        metapath: "./evaluation"
        folder: eth
        model_name: gaze
        step: 5

    data:
        # 修改为本地数据集路径 / change to your local dataset path
        image: "./datasets/ETH-Gaze/Image/train"
        label: "./datasets/ETH-Gaze/Label/trainYP.label"
        header: True
        name: eth
        isFolder: False

    pretrain:
        enable: False
        path: PLACEHOLDER
        device: PLACEHOLDER

    device: 0

    reader: reader

# dropout = 0
# dim_feed = 512
