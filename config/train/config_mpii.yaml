---
train:

    params:
        batch_size: 64
        epoch: 80
        lr: 0.0005
        decay: 0.5
        decay_step: 15
        warmup: 5

    save:
        # 输出目录，相对于项目根
        metapath: "./evaluation"
        folder: mpii
        model_name: gaze
        step: 10

    data:
        # 修改为本地数据集路径，目录结构参考 README "数据集准备" 一节
        image: "./datasets/MPIIFaceGaze/Image"
        label: "./datasets/MPIIFaceGaze/Label"
        header: True
        name: mpii
        isFolder: True
        
    pretrain:
        # 可选：用 GazeTR-H-ETH 权重初始化（strict=False）。
        # Optional: initialize from GazeTR-H-ETH weights (strict=False).
        enable: False
        path: "./ckpts/GazeTR-H-ETH.pt"
        device: 0

    device: 0

    reader: reader

# dropout = 0
# dim_feed = 512
